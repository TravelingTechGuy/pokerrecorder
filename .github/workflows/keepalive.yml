name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 hours
    - cron: '36 */3 * * *'
  workflow_dispatch: # Allows manual testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase Database Table
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/hosts?select=name&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Supabase API returned HTTP status: $STATUS"

          if [ "$STATUS" -ne 200 ]; then
            echo "Failed to query database table. Status code: $STATUS"
            exit 1
          fi
